<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(53, 53, 52, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .ar-scanner-frame {
            box-shadow: 0 0 0 100vmax rgba(19, 19, 19, 0.4);
        }
        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan {
            animation: scan-line 3s ease-in-out infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#343d96",
                        "surface-container": "#201f1f",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353534",
                        "on-tertiary-fixed-variant": "#5b4300",
                        "outline-variant": "#3b494c",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary-fixed": "#000767",
                        "secondary-fixed-dim": "#bdc2ff",
                        "outline": "#849396",
                        "on-primary-fixed-variant": "#004f58",
                        "tertiary-container": "#ffc948",
                        "inverse-on-surface": "#313030",
                        "on-secondary": "#1b247f",
                        "on-primary-fixed": "#001f24",
                        "surface-tint": "#00daf3",
                        "on-secondary-container": "#a8afff",
                        "surface-dim": "#131313",
                        "on-secondary-fixed-variant": "#343d96",
                        "tertiary-fixed-dim": "#fabd00",
                        "surface-container-high": "#2a2a2a",
                        "surface-bright": "#393939",
                        "error-container": "#93000a",
                        "on-primary-container": "#00626e",
                        "on-tertiary-container": "#725400",
                        "on-background": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "error": "#ffb4ab",
                        "tertiary": "#ffebc6",
                        "primary-fixed-dim": "#00daf3",
                        "background": "#131313",
                        "on-primary": "#00363d",
                        "primary-container": "#00e5ff",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "inverse-surface": "#e5e2e1",
                        "secondary": "#bdc2ff",
                        "inverse-primary": "#006875",
                        "surface-variant": "#353534",
                        "on-tertiary-fixed": "#261a00",
                        "primary": "#c3f5ff",
                        "secondary-fixed": "#e0e0ff",
                        "tertiary-fixed": "#ffdf9e",
                        "on-error": "#690005",
                        "on-surface-variant": "#bac9cc",
                        "on-tertiary": "#3f2e00",
                        "primary-fixed": "#9cf0ff"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface overflow-hidden">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 w-full bg-[#131313]/60 backdrop-blur-xl shadow-[0_40px_40px_rgba(229,226,225,0.05)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full border-2 border-primary-container p-0.5 overflow-hidden">
<img class="w-full h-full object-cover rounded-full" data-alt="Modern close-up portrait of a user with soft cyan lighting reflecting on face, digital artist aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClU56DNL2LrlbFb86cRWWwKnqS9pj4P7xKi7rEOueBUWr9E0XXiKC-tKcUH20moB6mjig2i7VJVpxdpAIB1yDFVClmoI96DaKWhrqiPqkZQfWM4qXWGcSR1lPjUfIuSWEEAuLyGtWv0kDZusEJka_g4bdcfImf0yJj22qiPWwPo1hliK45jgybPt1uoP38g9bIzjD4Wr-DmJLxR6kXg_JAKjJeKvmFd7f2z6uDnryVgQBn1pLCtQ3jHfIuibWwJdbFauSw28BoRqU"/>
</div>
<div class="flex flex-col">
<span class="text-xl font-headline font-bold tracking-widest text-[#00E5FF] uppercase">The Chronos Interface</span>
<span class="text-[10px] font-label font-bold tracking-[0.1rem] text-on-surface-variant uppercase">Operator Level 24</span>
</div>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-surface-container-highest/40 rounded-full border border-outline-variant/15">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-headline font-bold text-[#00E5FF] tracking-tight">1,250 XP</span>
</div>
</header>
<!-- AR Camera View Container -->
<main class="relative h-screen w-full overflow-hidden bg-surface-dim">
<!-- Mock Camera Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-screen object-cover scale-110" data-alt="Interior of a historic marble museum hall with classical statues and dramatic shaft of light coming from high windows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1DBh8hQ8m2F2Cqv-KaLDFHbNWB164lPtWYYx7fE5xLyaxq7NNxW5QBSq2CWZeWqWAT7fg7NcgHEb3ExY-Xwi3jF5CqJzXtDyfGJINORNV-rVt671ibyteqytFPJVdDNqqqLdGJIFrd08UvHhfMWe5mtOR-y2GxDwbaLQ21JEg0Mf6EjnlcuLFb-SvhIFidXGnymClh7QHfHBlvTcE0iTB667tdk4_yaRULRhsSKoqREdRjKf7bXivcawyyWOvUfIs_KFGrlNsKew"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-transparent to-surface/80"></div>
</div>
<!-- AR Reticle and Scanner -->
<div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
<div class="relative w-72 h-72 md:w-96 md:h-96">
<!-- Outer Corner Brackets -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary-container rounded-tl-xl shadow-[0_0_15px_#00e5ff]"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary-container rounded-tr-xl shadow-[0_0_15px_#00e5ff]"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-container rounded-bl-xl shadow-[0_0_15px_#00e5ff]"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-container rounded-br-xl shadow-[0_0_15px_#00e5ff]"></div>
<!-- Inner Animated Scan Line -->
<div class="absolute left-4 right-4 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50 blur-sm animate-scan"></div>
<!-- Scanning Focus Circle -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-16 h-16 border border-primary/20 rounded-full flex items-center justify-center">
<div class="w-1 h-1 bg-primary-container rounded-full animate-pulse shadow-[0_0_10px_#00e5ff]"></div>
</div>
</div>
</div>
</div>
<!-- Floating Instructions -->
<div class="absolute top-32 left-0 right-0 flex justify-center z-20 px-6">
<div class="glass-panel px-6 py-3 rounded-2xl border border-outline-variant/15 text-center max-w-xs shadow-xl">
<p class="font-label text-sm font-bold tracking-wide text-on-surface uppercase mb-1">Environmental Scan</p>
<p class="font-body text-xs text-on-surface-variant leading-relaxed">Scan a marker to discover Pedro S. Tolentino's legacy.</p>
</div>
</div>
<!-- Lateral Floating Actions -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-20">
<!-- Hint Button -->
<button class="w-14 h-14 glass-panel rounded-full flex items-center justify-center border border-outline-variant/20 hover:bg-surface-container-highest transition-colors active:scale-90">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="text-[8px] font-bold uppercase tracking-tighter mt-0.5 text-tertiary">Hint</span>
</div>
</button>
<!-- Flash Button -->
<button class="w-14 h-14 glass-panel rounded-full flex items-center justify-center border border-outline-variant/20 hover:bg-surface-container-highest transition-colors active:scale-90">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container">flash_on</span>
<span class="text-[8px] font-bold uppercase tracking-tighter mt-0.5 text-on-surface-variant">Flash</span>
</div>
</button>
<!-- My Collection Button -->
<button class="w-14 h-14 glass-panel rounded-full flex items-center justify-center border border-outline-variant/20 hover:bg-surface-container-highest transition-colors active:scale-90">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface">inventory_2</span>
<span class="text-[8px] font-bold uppercase tracking-tighter mt-0.5 text-on-surface-variant">Relics</span>
</div>
</button>
</div>
<!-- Status HUD (Bottom Left) -->
<div class="absolute bottom-32 left-6 z-20 flex flex-col gap-2 pointer-events-none">
<div class="flex items-center gap-2 text-[#00E5FF] opacity-80">
<span class="material-symbols-outlined text-sm">satellite_alt</span>
<span class="font-label text-[10px] font-bold tracking-[0.2em] uppercase">Tracking Active</span>
</div>
<div class="h-0.5 w-32 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-primary-container shadow-[0_0_10px_#00e5ff]"></div>
</div>
<span class="font-label text-[10px] text-on-surface-variant tracking-widest uppercase">Signal Strength: 82%</span>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full rounded-t-[2.5rem] z-50 pb-safe bg-[#353534]/60 backdrop-blur-2xl border-t border-[#3b494c]/15 shadow-[0_-20px_40px_rgba(0,229,255,0.1)]">
<div class="flex justify-around items-end px-4 h-24 w-full">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 p-2 hover:text-[#00E5FF] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-['Manrope'] text-[10px] tracking-[0.05rem] uppercase font-bold">Home</span>
</a>
<!-- Map -->
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 p-2 hover:text-[#00E5FF] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">map</span>
<span class="font-['Manrope'] text-[10px] tracking-[0.05rem] uppercase font-bold">Map</span>
</a>
<!-- AR Camera (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-gradient-to-tr from-[#c3f5ff] to-[#00e5ff] text-[#131313] rounded-full p-4 scale-110 -translate-y-4 shadow-[0_0_20px_#00e5ff] active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined text-3xl">ink_highlighter</span>
<span class="font-['Manrope'] text-[8px] tracking-[0.05rem] uppercase font-bold">AR Camera</span>
</a>
<!-- Quizzes -->
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 p-2 hover:text-[#00E5FF] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">extension</span>
<span class="font-['Manrope'] text-[10px] tracking-[0.05rem] uppercase font-bold">Quizzes</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 p-2 hover:text-[#00E5FF] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-['Manrope'] text-[10px] tracking-[0.05rem] uppercase font-bold">Profile</span>
</a>
</div>
</nav>
</body></html>
